name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check Python files compile (syntax check)
        run: |
          python -m py_compile backend/*.py

      - name: Verify imports work
        run: |
          cd backend
          python -c "import agent, search, extractor, graph_store, app" || echo "Note: app.py import may show Streamlit warnings, this is expected outside a Streamlit runtime"
